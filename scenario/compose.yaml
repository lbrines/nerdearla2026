services:
  pricing-api:
    build:
      context: ..
      dockerfile: scenario/services/pricing/Dockerfile
      args:
        GO_VERSION: ${GO_VERSION}
    ports:
      - "127.0.0.1:18080:8080"
    networks:
      - operator_net
      - fault_net
    volumes:
      - lab_logs:/logs

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:${TOXIPROXY_VERSION}
    command: ["-host=0.0.0.0", "-config", "/config/neutral.json"]
    volumes:
      - ./fault/toxiproxy/neutral.json:/config/neutral.json:ro
    networks:
      - fault_net

  checkout-1:
    build:
      context: ..
      dockerfile: scenario/services/checkout/Dockerfile
      args:
        GO_VERSION: ${GO_VERSION}
    environment:
      CHECKOUT_INSTANCE: checkout-1
      PRICING_UPSTREAM_URL: http://pricing-api:8080
    ports:
      - "127.0.0.1:18081:8080"
    networks:
      - operator_net
    volumes:
      - lab_logs:/logs
    depends_on:
      - pricing-api

  checkout-2:
    build:
      context: ..
      dockerfile: scenario/services/checkout/Dockerfile
      args:
        GO_VERSION: ${GO_VERSION}
    environment:
      CHECKOUT_INSTANCE: checkout-2
      PRICING_UPSTREAM_URL: http://pricing-api:8080
    ports:
      - "127.0.0.1:18082:8080"
    networks:
      - operator_net
    volumes:
      - lab_logs:/logs
    depends_on:
      - pricing-api

  checkout-3:
    build:
      context: ..
      dockerfile: scenario/services/checkout/Dockerfile
      args:
        GO_VERSION: ${GO_VERSION}
    environment:
      CHECKOUT_INSTANCE: checkout-3
      PRICING_UPSTREAM_URL: http://toxiproxy:8666
    ports:
      - "127.0.0.1:18083:8080"
    networks:
      - operator_net
      - fault_net
    volumes:
      - lab_logs:/logs
    depends_on:
      - pricing-api
      - toxiproxy

  checkout-gateway:
    build:
      context: ..
      dockerfile: scenario/services/gateway/Dockerfile
      args:
        GO_VERSION: ${GO_VERSION}
    environment:
      CHECKOUT_BACKEND_URLS: http://checkout-1:8080,http://checkout-2:8080,http://checkout-3:8080
    ports:
      - "127.0.0.1:18084:8080"
    networks:
      - operator_net
    volumes:
      - lab_logs:/logs
    depends_on:
      - checkout-1
      - checkout-2
      - checkout-3

  prometheus:
    image: prom/prometheus:v${PROMETHEUS_VERSION}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "127.0.0.1:19090:9090"
    networks:
      - operator_net
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION}
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 5s
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/overview.json
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_SERVER_HTTP_ADDR: 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - operator_net
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  load-generator:
    build:
      context: ..
      dockerfile: scenario/services/loadgen/Dockerfile
      args:
        GO_VERSION: ${GO_VERSION}
    environment:
      LOADGEN_TARGET_URL: http://checkout-gateway:8080/checkout
    networks:
      - operator_net
    volumes:
      - lab_logs:/logs
    depends_on:
      - checkout-gateway

  investigator:
    profiles: ["investigator"]
    build:
      context: ..
      dockerfile: investigator/Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION}
        OPENCODE_CLI_VERSION: ${OPENCODE_CLI_VERSION}
    networks:
      - operator_net
    volumes:
      - lab_logs:/var/log/lab:ro
      - ${OPENCODE_DATA_DIR:-$HOME/.local/share/nerdearla2026/opencode}:/home/node/.local/share/opencode

volumes:
  lab_logs:
  prometheus_data:

networks:
  operator_net:
    driver: bridge
  fault_net:
    driver: bridge
